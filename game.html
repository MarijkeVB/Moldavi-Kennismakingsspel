<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Moldavië kennismakingsspel</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;background:#f4f6f8;color:#17212b;display:flex;justify-content:center}.wrap{width:min(100%,520px);padding:22px 18px 36px}.top{text-align:center;margin:8px 0 18px}.eyebrow{font-size:13px;letter-spacing:1.8px;font-weight:700;text-transform:uppercase;opacity:.65}h1{margin:7px 0 0;font-size:34px}.card{background:#fff;border-radius:22px;padding:16px;box-shadow:0 8px 30px rgba(0,0,0,.10)}.photo{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:16px;display:block}.hint{margin:20px 4px 4px;font-size:19px;line-height:1.5}.question{margin:20px 4px 2px;padding:15px;border-radius:14px;background:#eef3f7;text-align:center;font-weight:800;font-size:22px}.footer{text-align:center;margin-top:18px;font-size:13px;opacity:.55}</style></head><body><main class="wrap"><div class="top"><div class="eyebrow">Moldavië • kennismakingsspel</div><h1 id="post"></h1></div><section class="card"><img id="photo" class="photo" alt="Fotodetail als aanwijzing"><p id="hint" class="hint"></p><div class="question">Wie ben ik?</div></section><div class="footer">Noteer je antwoord op het deelnemersformulier.</div></main><script>const clues=["Ik werk met gezinnen. Muziek maken doe ik graag en ik trek er ook graag wandelend op uit. Wie ben ik?","Auto's spelen een belangrijke rol in mijn werk. In mijn vrije tijd klus en tuinier ik graag en een vakantie sla ik niet af.","Ik werk én leer in de maatschappelijke zorg. Mijn dagelijks werk draait om het persoonlijk begeleiden van anderen. In mijn vrije tijd vind ik het leuk om te sporten en met vrienden af te spreken.","Ik werk in de zorg met mensen met een vorm van dementie. Buiten mijn werk wandel en tuinier ik graag.","Overdag ben ik uitvoerder. Buiten werktijd vind je mij op het korfbalveld of gezellig op stap.","Mijn opleiding en werk liggen in de maatschappelijke zorg, maar ik heb ook een sportopleiding afgerond. Voetbal, padel en sportschool passen helemaal bij mij.","Mijn werk draait om relaties en mensen, en daarnaast studeer ik theologie. Sportief ben ik behoorlijk veelzijdig en ik verdiep me graag in filosofie en theologie.","Op kantoor zorg ik dat alles goed georganiseerd verloopt. Daarnaast korfbal en bootcamp ik en houd ik ook van uitgaan.","Cijfers en administratie zijn mijn dagelijkse werk. In mijn vrije tijd lees ik graag of ben ik creatief bezig.","Mijn werk ligt in de bouw, maar niet met de hamer in mijn hand: ik bereid het werk voor. In mijn vrije tijd stap ik graag op de racefiets.","Ik ben timmerman en voorman. Ik houd van postduiven en vissen, en er is een vrouw in mijn leven die naar een bloem is vernoemd.","Leidingen en installaties kennen voor mij weinig geheimen. Als ik vrij ben, sta ik graag op het voetbalveld.","Ik volg VMBO Kader. Geef mij in mijn vrije tijd een voetbal en ik ben tevreden.","Ik leer voor allround timmerman en werk in de bouw. Naast timmeren houd ik van karten en heb ik een verzameling die je op een platenspeler kunt zetten.","Het werkzame leven zit erop, maar stilzitten hoeft voor mij niet. Er is in en rond het huis altijd wel iets te klussen.","Ik heb een opleiding Fashion Tailor gevolgd en werk bij een hondenpension. Paarden zijn mijn andere grote dierenliefde.","Ik zit op het VMBO-TL. Dansen en gezellig met vrienden afspreken doe ik graag.","Mijn beroep is niet eenvoudig in één hokje te stoppen: veelzijdig dus! Mijn sport is korfbal.","Mijn werk heeft met commercialisatie te maken. Stilzitten is niets voor mij: tennis, korfbal én Hyrox-training.","Mijn dagelijkse werk draait om bouwen en aannemen. Na werktijd verruil ik de bouw voor tennis of Hyrox-training.","Ik ben servicemonteur JOZ en huisman. Oude brommers, trekkers en auto's kunnen op mijn belangstelling rekenen. Geef mij daarnaast hout of ijzer en ik knutsel graag iets in elkaar.","Ik ben timmerman geweest en ben kleine veehouder. Ik houd mezelf graag fit met fietsen en zwemmen.","Naast mijn VMBO-TL heb ik een bijbaantje in de supermarkt. Mijn sport is voetbal.","Mijn werk speelt zich af tussen de koeien, maar mijn opleiding was werktuigbouw. Paardrijden, tuinieren en creatief bezig zijn doe ik graag.","Ik ben vestigingsmanager. Thuis pak ik graag een klus aan, maar met een goed boek kan ik me ook prima vermaken."];const order=[14,2,21,9,18,5,24,11,3,16,7,22,1,20,13,25,6,17,10,23,4,15,19,8,12];let p=parseInt(new URLSearchParams(location.search).get('p'));if(!(p>=1&&p<=25))p=1;const src=order[p-1];document.getElementById('post').textContent='Post '+p;document.getElementById('photo').src='post-'+String(src).padStart(2,'0')+'.jpg';document.getElementById('hint').textContent=clues[src-1];</script></body></html>
